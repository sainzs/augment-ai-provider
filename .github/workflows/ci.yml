name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Live test (requires Augment credentials)
        env:
          AUGMENT_API_TOKEN: ${{ secrets.AUGMENT_API_TOKEN }}
          AUGMENT_API_URL: ${{ secrets.AUGMENT_API_URL }}
        run: node test/live-test.mjs
      - run: node --check index.js
      - run: node --check bin/sync-models.mjs
      - run: node --check test/live-test.mjs
