<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>augment-ai-provider</title>
<style>
  :root {
    --bg: #000000;
    --panel: #070707;
    --ink: #eeeeee;
    --dim: #8a8a93;
    --faint: #55555e;
    --accent: #00ffb2;
    --green: #00ffb2;
    --border: #16181a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: "Berkeley Mono Variable", "Berkeley Mono", ui-monospace, Menlo, monospace;
    color: var(--ink);
    padding: 48px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .wordmark { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
  .wordmark .name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .wordmark .tag  { color: var(--accent); font-size: 13px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
  .sub b { color: var(--ink); font-weight: 600; }
  .term {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    width: 880px;
  }
  .term-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; background: #101013; border-bottom: 1px solid var(--border);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .term-title { margin-left: 10px; color: var(--faint); font-size: 12px; }
  .term-body { padding: 20px 22px 24px; font-size: 13.5px; line-height: 1.55; min-height: 360px; }
  .p { color: var(--accent); font-weight: 700; }
  .cmd { color: var(--ink); }
  .out { color: var(--dim); white-space: pre-wrap; }
  .ok  { color: var(--green); }
  .hl  { color: var(--ink); }
  .line { display: block; }
  .cursor { display:inline-block; width:8px; height:16px; background:var(--accent); vertical-align:-2px; }
  .cursor.blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .gap { height: 14px; }
  .stream { opacity: 0; }
</style>
</head>
<body>
  <div class="wordmark">
    <span class="name">augment-ai-provider</span>
    <span class="tag">pi · opencode · ai-sdk</span>
  </div>
  <div class="sub">
    One provider. Every Augment model, in your agent.<br />
    Direct HTTP through <b>@augmentcode/auggie-sdk</b> — no subprocess.
  </div>

  <div class="term">
    <div class="term-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="term-title">pi — augment-ai-provider</span>
    </div>
    <div class="term-body" id="body"></div>
  </div>

<script>
const body = document.getElementById("body");

// The script: real session content, animated.
const SCRIPT = [
  { type: "cmd",  text: "pi install git:github.com/sainzs/augment-ai-provider" },
  { type: "out",  text: "✓ installed augment provider · 29 models discovered", cls: "ok" },
  { type: "gap" },
  { type: "cmd",  text: "pi --list-models augment" },
  { type: "stream", lines: [
    "provider  model                   context  max-out",
    "augment   claude-sonnet-5-0       200K     32.8K",
    "augment   claude-opus-4-8         200K     32.8K",
    "augment   gpt-5-6-sol             200K     32.8K",
    "augment   kimi-k3                 200K     32.8K",
    "augment   glm-5-2                 200K     32.8K",
    "augment   grok-4-6                200K     32.8K",
    "… 23 more",
  ]},
  { type: "gap" },
  { type: "cmd",  text: 'pi --model augment/claude-sonnet-5-0 "ship it"' },
  { type: "out",  text: "● streaming… tool call bash · done in 1.2s", cls: "ok" },
  { type: "done" },
];

const TYPE_MS = 34;      // per char
const LINE_MS = 90;      // per streamed line
const AFTER_CMD = 260;   // pause after a command before output
const END_HOLD = 1600;   // hold on final frame

let cursor = null;
function newCursor(blink = true) {
  const c = document.createElement("span");
  c.className = "cursor" + (blink ? " blink" : "");
  return c;
}
function placeCursor() { if (cursor) body.appendChild(cursor); }

function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstChild; }

async function typeCommand(text) {
  const line = document.createElement("div");
  line.innerHTML = `<span class="p">$</span> <span class="cmd"></span>`;
  const cmdSpan = line.querySelector(".cmd");
  body.appendChild(line);
  cursor = newCursor(false);
  line.appendChild(cursor);
  for (const ch of text) {
    cmdSpan.textContent += ch;
    line.appendChild(cursor);
    await wait(TYPE_MS);
  }
  await wait(AFTER_CMD);
  cursor.remove();
}

async function showOut(text, cls) {
  const line = document.createElement("div");
  line.innerHTML = `<span class="out ${cls || ""}">${escapeHtml(text)}</span>`;
  body.appendChild(line);
}

async function streamLines(lines) {
  const box = document.createElement("div");
  box.className = "out";
  body.appendChild(box);
  for (const ln of lines) {
    const s = document.createElement("span");
    s.className = "line";
    s.textContent = ln;
    box.appendChild(s);
    await wait(LINE_MS);
  }
}

function addGap() { const g = document.createElement("div"); g.className = "gap"; body.appendChild(g); }

function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function run() {
  for (const step of SCRIPT) {
    if (step.type === "cmd") await typeCommand(step.text);
    else if (step.type === "out") await showOut(step.text, step.cls);
    else if (step.type === "stream") await streamLines(step.lines);
    else if (step.type === "gap") addGap();
    else if (step.type === "done") {
      const p = document.createElement("div");
      p.innerHTML = `<span class="p">▊</span>`;
      cursor = newCursor(true);
      p.appendChild(cursor);
      body.appendChild(p);
    }
  }
  window.__done = true;
}
run();
</script>
</body>
</html>
